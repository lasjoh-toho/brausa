name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Release button: Actions → CI → "Run workflow" with a version like v0.2.0.
  # Creates the tag on the chosen commit, then builds and attaches installers.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release, e.g. v0.2.0'
        required: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # Creates the GitHub Release (and the tag, when started from the release button)
  # once, so the three installer jobs below only attach files and never race.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [web, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: brausa ${{ steps.tag.outputs.tag }}
          # A full release, not a pre-release: the app's updater reads releases/latest.
          prerelease: false
          body_path: docs/RELEASE_NOTES.md
          files: |
            packaging/LIESMICH-macOS.txt
            packaging/LIESMICH-Windows.txt
            packaging/README-macOS.txt
            packaging/README-Windows.txt

  # Installer for all three platforms (also on PRs, so macOS/Windows breakage shows up before merge).
  bundle:
    needs: [web, rust, release]
    # Run even though `release` is skipped on PRs and branch pushes.
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write # needed to attach installers to a GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ''
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      # Update signing (see docs/UPDATES.md). Without the secret the installers are
      # built as before, just without update files.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build
        shell: bash
        run: |
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            npm run tauri build -- ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without update files"
            npm run tauri build -- ${{ matrix.args }}
          fi
      # Tauri's DMG has no room for extra files, so rebuild it with the app, the
      # Applications link and the read-me (how to allow the unsigned app, disclaimer).
      - if: matrix.os == 'macos-latest'
        name: DMG mit LIESMICH
        run: |
          b=src-tauri/target/universal-apple-darwin/release/bundle
          dmg=$(ls "$b"/dmg/*.dmg)
          stage=$(mktemp -d)/brausa
          mkdir -p "$stage"
          ditto "$b/macos/brausa.app" "$stage/brausa.app"
          ln -s /Applications "$stage/Applications"
          cp packaging/LIESMICH-macOS.txt "$stage/LIES MICH.txt"
          cp packaging/README-macOS.txt "$stage/READ ME.txt"
          rm "$dmg"
          for i in 1 2 3; do
            hdiutil create -volname brausa -srcfolder "$stage" -ov -format UDZO "$dmg" && break
            sleep 5
          done
          test -f "$dmg"
          hdiutil attach -nobrowse -readonly "$dmg" -mountpoint /tmp/brausa-dmg
          ls -la /tmp/brausa-dmg
          codesign -dv /tmp/brausa-dmg/brausa.app
          hdiutil detach /tmp/brausa-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: brausa-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
          if-no-files-found: warn
      - if: needs.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*-setup.exe
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig
          fail_on_unmatched_files: false

  # latest.json tells installed copies about the new version (only when signed).
  updater:
    needs: [release, bundle]
    if: ${{ needs.release.outputs.tag != '' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - if: env.HAS_UPDATER_KEY == 'true'
        run: |
          mkdir sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs
          node scripts/latest-json.mjs "$TAG" "$GITHUB_REPOSITORY" sigs docs/RELEASE_NOTES.md > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

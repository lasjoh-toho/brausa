[package]
name = "brausa"
version = "0.6.0"
description = "Plattformunabhängiger visueller Datei-Browser"
edition = "2021"
license = "MIT"

[lib]
name = "brausa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6"
trash = "5"
tauri-plugin-opener = "2"
file-id = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
notify-debouncer-mini = "0.7"

# Image decoding is painfully slow unoptimised; keep dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
tempfile = "3"
